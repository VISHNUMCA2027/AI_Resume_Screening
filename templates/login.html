<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - AI Resume Screening System</title>


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- =====================================================
         BOOTSTRAP
         ===================================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- =====================================================
         COMMON CSS
         ===================================================== -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">



    <style>


        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {

            width: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

        }


        body {

            background: #050a24 !important;

            color: #ffffff !important;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }



        /* =====================================================
           NAVBAR
           ===================================================== */

        .login-navbar {

            background: #070b29 !important;

            border-bottom: 1px solid #263b75 !important;

            padding: 14px 25px;

        }


        .login-navbar-brand {

            color: #ffffff !important;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

        }


        .login-navbar-brand:hover {

            color: #ffffff !important;

        }



        /* =====================================================
           LOGIN CONTAINER
           ===================================================== */

        .login-container {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 35px 15px;

        }



        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-card {

            width: 100%;

            max-width: 420px;

            background: #101735 !important;

            border: 1px solid #304b88 !important;

            border-radius: 12px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);

        }



        /* =====================================================
           ROBOT ICON
           ===================================================== */

        .robot-logo {

            width: 78px;

            height: 78px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #17234b !important;

            border: 1px solid #304b88;

            border-radius: 50%;

        }


        .robot-logo i {

            color: #20c3df !important;

            font-size: 38px;

        }



        /* =====================================================
           TITLE
           ===================================================== */

        .login-title {

            color: #ffffff !important;

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 6px;

        }



        /* =====================================================
           SUBTITLE
           ===================================================== */

        .login-subtitle {

            color: #9eb2dc !important;

            text-align: center;

            font-size: 14px;

            margin-bottom: 28px;

        }



        /* =====================================================
           FORM LABEL
           ===================================================== */

        .form-label {

            color: #ffffff !important;

            font-size: 14px;

            font-weight: 600;

        }



        /* =====================================================
           INPUT ICON
           ===================================================== */

        .input-group-text {

            background: #17234b !important;

            border: 1px solid #304b88 !important;

            color: #20c3df !important;

            min-width: 45px;

            justify-content: center;

        }



        /* =====================================================
           INPUT
           ===================================================== */

        .form-control {

            height: 43px;

            background: #111a3b !important;

            border: 1px solid #304b88 !important;

            color: #ffffff !important;

        }


        .form-control::placeholder {

            color: #7185b5 !important;

        }


        .form-control:focus {

            background: #111a3b !important;

            color: #ffffff !important;

            border-color: #20c3df !important;

            box-shadow:
                0 0 0 2px rgba(32, 195, 223, 0.12) !important;

        }



        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-btn {

            width: 100%;

            height: 43px;

            background: #20c3df !important;

            border: none !important;

            border-radius: 6px;

            color: #061028 !important;

            font-weight: bold;

            font-size: 15px;

        }


        .login-btn:hover {

            background: #19b5d0 !important;

            color: #061028 !important;

        }


        .login-btn i {

            margin-right: 6px;

        }



        /* =====================================================
           BACK TO WELCOME BUTTON
           ===================================================== */

        .back-btn {

            display: block;

            width: 100%;

            height: 43px;

            line-height: 43px;

            margin-top: 12px;

            background: #101b40 !important;

            border: 1px solid #30528d !important;

            border-radius: 6px;

            color: #ffffff !important;

            text-align: center;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;

        }


        .back-btn:hover {

            background: #172653 !important;

            color: #ffffff !important;

        }


        .back-btn i {

            margin-right: 6px;

        }



        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .error-message {

            background: rgba(255, 59, 59, 0.10);

            border: 1px solid #8f3030;

            border-radius: 6px;

            color: #ff6b6b;

            padding: 10px 12px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;

        }


        .error-message i {

            margin-right: 5px;

        }



        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer {

            color: #7185b5 !important;

            text-align: center;

            font-size: 12px;

            margin-top: 22px;

        }



        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {


            .login-navbar {

                padding: 12px 15px;

            }


            .login-navbar-brand {

                font-size: 14px;

            }


            .login-card {

                padding: 28px 20px;

            }


            .login-title {

                font-size: 24px;

            }


            .robot-logo {

                width: 70px;

                height: 70px;

            }


            .robot-logo i {

                font-size: 32px;

            }

        }


    </style>

</head>



<body>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="login-navbar">


        <!--
        IMPORTANT:
        This goes to the actual Welcome page.
        -->

        <a href="{{ url_for('welcome') }}"
           class="login-navbar-brand">

            🤖 AI Resume Screening System

        </a>


    </nav>



    <!-- =====================================================
         LOGIN CONTAINER
         ===================================================== -->

    <div class="login-container">


        <div class="login-card">


            <!-- =================================================
                 ROBOT
                 ================================================= -->

            <div class="robot-logo">

                <i class="fa-solid fa-robot"></i>

            </div>



            <!-- =================================================
                 TITLE
                 ================================================= -->

            <h1 class="login-title">

                Admin Login

            </h1>


            <p class="login-subtitle">

                Login to access the AI Resume Screening System

            </p>



            <!-- =================================================
                 ERROR
                 ================================================= -->

            {% if error %}

            <div class="error-message">

                <i class="fa-solid fa-circle-exclamation"></i>

                {{ error }}

            </div>

            {% endif %}



            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                action="{{ url_for('admin') }}"
                method="POST"
            >


                <!-- =============================================
                     USERNAME
                     ============================================= -->

                <div class="mb-3">


                    <label
                        for="username"
                        class="form-label"
                    >

                        Username

                    </label>


                    <div class="input-group">


                        <span class="input-group-text">

                            <i class="fa-solid fa-user"></i>

                        </span>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >


                    </div>


                </div>



                <!-- =============================================
                     PASSWORD
                     ============================================= -->

                <div class="mb-4">


                    <label
                        for="password"
                        class="form-label"
                    >

                        Password

                    </label>


                    <div class="input-group">


                        <span class="input-group-text">

                            <i class="fa-solid fa-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >


                    </div>


                </div>



                <!-- =============================================
                     LOGIN BUTTON
                     ============================================= -->

                <button
                    type="submit"
                    class="btn login-btn"
                >

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>



                <!-- =============================================
                     BACK TO WELCOME
                     ============================================= -->

                <a
                    href="{{ url_for('welcome') }}"
                    class="back-btn"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Welcome

                </a>


            </form>



            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <div class="login-footer">

                AI Resume Screening System

            </div>


        </div>

    </div>



    <!-- =====================================================
         BOOTSTRAP JS
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
