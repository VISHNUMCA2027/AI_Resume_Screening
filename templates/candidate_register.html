<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Registration - AI Resume Screening System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #07111f, #102a43, #0b1728);
            color: white;
        }

        .container {
            width: 400px;
            padding: 35px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #b9c7d8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #dce8f5;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #aebdcc;
        }

        input:focus {
            border: 1px solid #00d9ff;
            box-shadow: 0 0 10px rgba(0,217,255,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00c8ff;
            color: #00131d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00e5ff;
            transform: translateY(-2px);
        }

        .error {
            background: rgba(255,70,70,0.15);
            border: 1px solid #ff5252;
            color: #ff8a8a;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #b9c7d8;
            font-size: 14px;
        }

        .bottom a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🤖</div>

    <h1>Candidate Registration</h1>

    <p class="subtitle">
        AI Resume Screening System
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label>Email ID</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Re-enter your password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="{{ url_for('candidate_login') }}">
            Candidate Login
        </a>
    </div>

    <a
        href="{{ url_for('welcome') }}"
        class="back"
    >
        ← Back to Welcome
    </a>

</div>

</body>
</html>
