<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Resume Screening{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="{{ url_for('home_page') }}">
            🤖 AI Resume Screening
        </a>

        <div>

            {% if session.get('admin_logged_in') %}

                <a href="{{ url_for('home_page') }}" class="btn btn-light btn-sm">
                    Home
                </a>

                <a href="{{ url_for('dashboard') }}" class="btn btn-warning btn-sm">
                    Dashboard
                </a>

                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('admin') }}" class="btn btn-success btn-sm">
                    Admin Login
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
