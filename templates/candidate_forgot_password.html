<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AI Resume Screening</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #12305a,
                    #071226 55%,
                    #030914
                );

            color: white;

            font-family: Arial, sans-serif;

        }


        .reset-container {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 15px;

        }


        .reset-card {

            width: 100%;

            max-width: 480px;

            background: rgba(13, 27, 53, 0.96);

            border: 1px solid #31527e;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

        }


        .icon {

            font-size: 55px;

            text-align: center;

            margin-bottom: 10px;

        }


        h2 {

            text-align: center;

            color: #ffc107;

            font-weight: bold;

        }


        .subtitle {

            text-align: center;

            color: #9db2d0;

            margin-bottom: 28px;

        }


        .form-label {

            color: #dcecff;

            font-weight: 600;

        }


        .form-control {

            background: #101f3d;

            color: white;

            border: 1px solid #31527e;

            border-radius: 10px;

            padding: 12px;

        }


        .form-control:focus {

            background: #101f3d;

            color: white;

            border-color: #ffc107;

            box-shadow:
                0 0 0 0.2rem rgba(255, 193, 7, 0.15);

        }


        .form-control::placeholder {

            color: #7890ae;

        }


        .reset-btn {

            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ff9800,
                    #ff5722
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

        }


        .reset-btn:hover {

            opacity: 0.9;

            transform: translateY(-1px);

        }


        .back-login {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #16d9ff;

            text-decoration: none;

            font-weight: 600;

        }


        .welcome-link {

            display: block;

            text-align: center;

            margin-top: 12px;

            color: #9db2d0;

            text-decoration: none;

        }


        .footer {

            text-align: center;

            color: #667d9d;

            font-size: 13px;

            margin-top: 25px;

        }

    </style>

</head>


<body>


<div class="reset-container">


    <div class="reset-card">


        <div class="icon">
            🔑
        </div>


        <h2>
            Forgot Password?
        </h2>


        <p class="subtitle">

            Reset your candidate account password

        </p>


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}


        <!-- RESET FORM -->

        <form
            method="POST"
            action="{{ url_for('candidate_forgot_password') }}"
        >


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Registered Email
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- NEW PASSWORD -->

            <div class="mb-3">

                <label
                    for="new_password"
                    class="form-label"
                >
                    New Password
                </label>


                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label
                    for="confirm_password"
                    class="form-label"
                >
                    Confirm New Password
                </label>


                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- RESET BUTTON -->

            <button
                type="submit"
                class="reset-btn"
            >

                🔄 Reset Password

            </button>


        </form>


        <!-- BACK TO LOGIN -->

        <a
            href="{{ url_for('candidate_login') }}"
            class="back-login"
        >
            ← Back to Candidate Login
        </a>


        <!-- BACK TO WELCOME -->

        <a
            href="{{ url_for('welcome') }}"
            class="welcome-link"
        >
            ← Back to Welcome
        </a>


        <div class="footer">

            AI Resume Screening System

        </div>


    </div>


</div>


</body>

</html>
