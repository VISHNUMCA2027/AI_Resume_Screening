{% extends "base.html" %}

{% block title %}Edit Candidate{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary mb-4">
            Edit Candidate
        </h2>

        <form action="/update/{{ candidate[0] }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Candidate Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ candidate[1] }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    value="{{ candidate[2] }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input
                    type="text"
                    class="form-control"
                    name="phone"
                    value="{{ candidate[3] }}"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">
                Update Candidate
            </button>

            <br><br>

            <a
                href="/dashboard"
                class="btn btn-secondary w-100">
                Back to Dashboard
            </a>

        </form>

    </div>

</div>

{% endblock %}
