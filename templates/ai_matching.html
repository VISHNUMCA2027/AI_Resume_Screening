<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Matching - AI Resume Screening System</title>


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Main CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            min-height: 100%;

            background: #050a24 !important;

            color: #ffffff !important;

            font-family: Arial, sans-serif;

        }


        body {

            min-height: 100vh;

            background: #050a24 !important;

        }


        /* ================= NAVBAR ================= */

        .navbar {

            background: #070b29 !important;

            border-bottom: 1px solid #263b75 !important;

        }


        .navbar-brand {

            color: #ffffff !important;

            font-weight: bold;

            font-size: 17px;

            text-decoration: none;

        }


        .navbar-brand:hover {

            color: #ffffff !important;

        }


        /* ================= BACK HOME ================= */

        .home-btn {

            background: #101b40 !important;

            border: 1px solid #30528d !important;

            color: #ffffff !important;

            font-weight: bold;

            margin-right: 5px;

        }


        .home-btn:hover {

            background: #172653 !important;

            color: #ffffff !important;

        }


        /* ================= LOGOUT ================= */

        .logout-btn {

            background: #ff4f73 !important;

            border: none !important;

            color: #ffffff !important;

            font-weight: bold;

        }


        .logout-btn:hover {

            background: #ff365f !important;

            color: #ffffff !important;

        }


        /* ================= CONTAINER ================= */

        .matching-container {

            max-width: 800px;

            margin: 0 auto;

            padding: 60px 20px;

        }


        /* ================= ICON ================= */

        .matching-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #101735 !important;

            border: 1px solid #304b88 !important;

            border-radius: 50%;

        }


        .matching-icon i {

            color: #20c3df !important;

            font-size: 45px;

        }


        /* ================= TITLE ================= */

        .matching-title {

            text-align: center;

            color: #ffffff !important;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .matching-subtitle {

            text-align: center;

            color: #b8c9ec !important;

            font-size: 15px;

            margin-bottom: 35px;

        }


        /* ================= CARD ================= */

        .matching-card {

            background: #101735 !important;

            border: 1px solid #304b88 !important;

            border-radius: 12px;

            padding: 30px;

            box-shadow: 0 10px 35px rgba(0,0,0,0.30);

        }


        .card-heading {

            color: #ffffff !important;

            font-size: 21px;

            font-weight: bold;

            text-align: center;

            margin-bottom: 25px;

        }


        .card-heading i {

            color: #20c3df !important;

            margin-right: 8px;

        }


        /* ================= FORM ================= */

        .form-label {

            color: #ffffff !important;

            font-size: 14px;

            font-weight: 600;

        }


        .form-control {

            background: #111a3b !important;

            border: 1px solid #304b88 !important;

            color: #ffffff !important;

            height: 43px;

        }


        textarea.form-control {

            height: 130px;

            resize: vertical;

        }


        .form-control::placeholder {

            color: #7185b5 !important;

        }


        .form-control:focus {

            background: #111a3b !important;

            color: #ffffff !important;

            border-color: #20c3df !important;

            box-shadow: 0 0 0 2px rgba(32,195,223,0.12) !important;

        }


        /* ================= MATCH BUTTON ================= */

        .match-btn {

            width: 100%;

            height: 45px;

            background: #20c3df !important;

            border: none !important;

            border-radius: 6px;

            color: #061028 !important;

            font-weight: bold;

            font-size: 15px;

        }


        .match-btn:hover {

            background: #19b5d0 !important;

            color: #061028 !important;

        }


        .match-btn i {

            margin-right: 7px;

        }


        /* ================= BACK HOME BUTTON ================= */

        .back-home-btn {

            display: block;

            width: 100%;

            height: 43px;

            line-height: 43px;

            margin-top: 12px;

            background: #101b40 !important;

            border: 1px solid #30528d !important;

            border-radius: 6px;

            color: #ffffff !important;

            text-align: center;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;

        }


        .back-home-btn:hover {

            background: #172653 !important;

            color: #ffffff !important;

        }


        .back-home-btn i {

            margin-right: 6px;

        }


        /* ================= INFO ================= */

        .info-box {

            margin-top: 20px;

            padding: 15px;

            background: #111a3b !important;

            border: 1px solid #304b88 !important;

            border-radius: 8px;

            color: #9eb2dc !important;

            font-size: 13px;

            text-align: center;

        }


        .info-box i {

            color: #20c3df !important;

            margin-right: 5px;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .navbar-brand {

                font-size: 14px;

            }


            .matching-container {

                padding: 40px 15px;

            }


            .matching-title {

                font-size: 28px;

            }


            .matching-card {

                padding: 22px 18px;

            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark px-4 py-3">

        <a class="navbar-brand"
           href="{{ url_for('home_page') }}">

            🤖 AI Resume Screening System

        </a>


        <div>

            <a href="{{ url_for('home_page') }}"
               class="btn btn-sm home-btn">

                <i class="fa-solid fa-house"></i>

                Home

            </a>


            <a href="{{ url_for('logout') }}"
               class="btn btn-sm logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="matching-container">


        <!-- ICON -->

        <div class="matching-icon">

            <i class="fa-solid fa-brain"></i>

        </div>


        <!-- TITLE -->

        <h1 class="matching-title">

            AI Matching

        </h1>


        <p class="matching-subtitle">

            Compare a candidate resume with job requirements
            using AI-based matching.

        </p>


        <!-- ================= CARD ================= -->

        <div class="matching-card">


            <h2 class="card-heading">

                <i class="fa-solid fa-robot"></i>

                Calculate AI Match

            </h2>


            <form action="{{ url_for('upload') }}"
                  method="POST"
                  enctype="multipart/form-data">


                <!-- Candidate Name -->

                <div class="mb-3">

                    <label for="name"
                           class="form-label">

                        Candidate Name

                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           placeholder="Enter candidate name"
                           required>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label for="email"
                           class="form-label">

                        Email

                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter candidate email"
                           required>

                </div>


                <!-- Phone -->

                <div class="mb-3">

                    <label for="phone"
                           class="form-label">

                        Phone Number

                    </label>

                    <input type="text"
                           id="phone"
                           name="phone"
                           class="form-control"
                           placeholder="Enter phone number"
                           required>

                </div>


                <!-- Job Requirements -->

                <div class="mb-3">

                    <label for="job_description"
                           class="form-label">

                        Job Requirements

                    </label>

                    <textarea id="job_description"
                              name="job_description"
                              class="form-control"
                              placeholder="Enter required skills and job requirements..."
                              required></textarea>

                </div>


                <!-- Resume -->

                <div class="mb-4">

                    <label for="resume"
                           class="form-label">

                        Upload Resume (PDF)

                    </label>

                    <input type="file"
                           id="resume"
                           name="resume"
                           class="form-control"
                           accept=".pdf"
                           required>

                </div>


                <!-- MATCH BUTTON -->

                <button type="submit"
                        class="btn match-btn">

                    <i class="fa-solid fa-brain"></i>

                    Calculate AI Match

                </button>


                <!-- BACK HOME -->

                <a href="{{ url_for('home_page') }}"
                   class="back-home-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Home

                </a>


            </form>


            <!-- INFO -->

            <div class="info-box">

                <i class="fa-solid fa-circle-info"></i>

                The system compares resume content with the
                entered job requirements and generates a matching score.

            </div>


        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
